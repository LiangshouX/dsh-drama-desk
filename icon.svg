<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Drama desk">
  <title>Drama desk</title>
  <desc>A storyboard grid: one failing shot among passing ones, seen from the director's desk.</desc>
  <rect x="4" y="10" width="56" height="44" rx="8" fill="#14171d" stroke="#39404c" stroke-width="2"/>
  <g>
    <rect x="10" y="16" width="14" height="12" rx="3" fill="#30a46c" opacity="0.85"/>
    <rect x="26" y="16" width="14" height="12" rx="3" fill="#4c8dff" opacity="0.7"/>
    <rect x="42" y="16" width="12" height="12" rx="3" fill="#7c8494" opacity="0.45"/>
    <rect x="10" y="32" width="14" height="12" rx="3" fill="#30a46c" opacity="0.85"/>
    <rect x="26" y="32" width="14" height="12" rx="3" fill="#e5484d" opacity="0.95"/>
    <rect x="42" y="32" width="12" height="12" rx="3" fill="#7c8494" opacity="0.45"/>
  </g>
  <circle cx="33" cy="38" r="8.5" fill="none" stroke="#3d9be9" stroke-width="2.5"/>
</svg>
