# dsh-drama-desk bundle patch
#
# One Host row. The row id is the plugin id the Plugin Manager shows;
# `name` must equal the package name so the client-modules scan resolves this
# package's ./client bundle and serves it at /plugins/dsh-drama-desk/client.js.
#
# `config` is replaced wholesale by any later patch layer, so every field the
# plugin needs is restated here. The user edits their own layer
# (`~/.dsh/profiles/<profile>/cordis.patch.yml`) to change these values; that
# layer survives plugin upgrades.
#
#   projectRoot  从哪里发现作品（<projectRoot>/workspaces/<work-id>/）。
#                留空 = 自动：先找当前会话工作目录，再找产物位置旁边的目录。
#   outputRoot   产物落点。**留空 = 自动**：跟随 Windows 的「视频」已知文件夹
#                （资源管理器里搬过位置也跟得住，通常不在系统盘）。
#                显式写死会覆盖这个自动解析。
#   model        规范分层里的模型适配 id，对应 build/spec/models/<id>/。
#   autoRefresh  读取磁盘文件的节流间隔（毫秒）；0 = 不自动刷新。
#   generationProvider / generationModel
#                提交生成时用哪个模型路由。留空 = 由 agent 自己决定。
#                （0.2 的旧字段，等价于下面的 videoChannel/videoModel；留着不坏老 profile。）
#   imageChannel / imageModel
#   videoChannel / videoModel
#                生成通道。留空或 'inherit' = **继承宿主**（用宿主已装好的连接器）；
#                写具体通道 id = 本插件指定的通道。*Model 留空 = 用通道默认。
#   channels     自定义通道：[{id, kind: image|video, label?, driver?, model?, tool?, cli?}]。
#                driver 绑定执行驱动（内置 'mcode'）；不绑定的只能当标注。
#                **不存任何密钥**——密钥归宿主的凭据服务。
#   mcodePath    mcode-tools 的路径。留空 = 自动发现（配置 → 宿主 PATH →
#                ~/.minimax/bin → ~/.minimax/bin/hosts/*，取最新）。填 'off' = 禁用。
#   paidExecution 'receipt'（默认）= 执行工具必须带计划摘要点名；'off' = 只出计划。
- insert:
    - id: drama-desk
      name: 'dsh-drama-desk'
      config:
        projectRoot: ''
        outputRoot: ''
        model: 'minimax'
        autoRefresh: 4000
        generationProvider: ''
        generationModel: ''
        imageChannel: ''
        imageModel: ''
        videoChannel: ''
        videoModel: ''
        channels: []
        mcodePath: ''
        paidExecution: 'receipt'
